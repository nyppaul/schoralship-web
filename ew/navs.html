<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Dashboard | ScholarLink</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{min-height:100vh;background:url('images/fischdoc-seattle-5217635_1920.jpg') center/cover no-repeat;color:#fff;}
    .overlay{position:fixed; inset:0; background:rgba(5,15,30,0.78); z-index:0;}

    /* NAVBAR */
    .navbar{
      position:relative; z-index:2; width:90%; max-width:1200px; margin:30px auto;
      padding:14px 24px; display:flex; align-items:center; justify-content:space-between;
      background:rgba(255,255,255,0.12); backdrop-filter:blur(18px); border-radius:20px;
    }
    .logo{font-weight:700; font-size:20px; letter-spacing:1px;}
    .nav-right{display:flex; align-items:center; gap:18px;}
    .nav-right img{width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.7);}
    .logout{font-size:18px; color:#ffb4b4; cursor:pointer;}

    .nav-links{list-style:none; display:flex; gap:25px; flex-wrap:wrap; transition: transform 0.3s ease, opacity 0.3s ease;}
    .nav-links a{color:#fff; text-decoration:none; font-size:15px; padding:8px 12px; border-radius:12px; transition:0.3s;}
    .nav-links a:hover{background: rgba(255,255,255,0.2);}

    /* HAMBURGER */
    .hamburger{
      display:none; flex-direction:column; gap:5px; cursor:pointer;
    }
    .hamburger span{
      display:block; width:25px; height:3px; background:#fff; border-radius:2px; transition:0.3s;
    }
    .hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
    .hamburger.active span:nth-child(2){opacity:0;}
    .hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}

  


   

    /* RESPONSIVE */
    @media(max-width:900px){
      .dashboard{grid-template-columns:1fr;}
      .footer-content{flex-direction:column; gap:20px;}
      .nav-links{
        display:flex;
        flex-direction:column;
        gap:10px;
        position:absolute;
        top:70px;
        right:24px;
        background:rgba(5, 15, 30, 0.836);
        backdrop-filter:blur(18px);
        border-radius:14px;
        padding:15px;
        opacity:0;
        transform:translateX(100%);
        pointer-events:none;
      }
      .nav-links.show{
        opacity:1;
        transform:translateX(0);
        pointer-events:auto;
      }
      .hamburger{display:flex;}
    }
    @media(max-width:600px){
      .welcome h1{font-size:26px;}
      .footer-message input,.footer-message textarea{font-size:13px;}
      .footer-message .btn{font-size:13px}
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <nav class="navbar">
    <div class="logo">🎓 ScholarLink</div>

    <ul class="nav-links" id="navLinks">
      <li><a href="#home">Home</a></li>
      <li><a href="#packages">Packages</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#testimonials">Testimonials</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <div class="nav-right">
      <img src="images/32bd4b537a57ef27ed4fe836112b7821.jpg" alt="User">
      <i class="fa-solid fa-right-from-bracket logout" title="Logout"></i>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  



  <script>


    // Hamburger toggle with animation
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      hamburger.classList.toggle('active');
    });

    // Optional: close menu when clicking a link on mobile
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        if(navLinks.classList.contains('show')){
          navLinks.classList.remove('show');
          hamburger.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
